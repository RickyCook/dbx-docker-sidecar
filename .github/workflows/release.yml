name: Release image

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against tag overrides
        # The workflow fires again if the tag is force-moved; refuse to
        # republish an existing version's digests (defense in depth on top of
        # protected tag rules — see README).
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "::error::ghcr tag ${TAG} already exists (force-moved tag?) — refusing to overwrite"
            exit 1
          fi

      - name: Extract semver metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
